<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Perfumes - View Page</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__brand">My Perfumes</div>
      <nav class="header__nav">
        <a href="index.html" class="header__link header__link--active"
          >My Perfumes</a
        >
        <a href="create.html" class="header__link">Create Perfume</a>
      </nav>
      <div class="header__actions">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search by manufacturer..."
        />
        <button class="btn btn--outline-blue" id="search-btn">Search</button>
        <button class="btn btn--outline-red" id="clear-btn">Clear</button>
      </div>
    </header>

    <main class="main-container">
      <aside class="sidebar">
        <h2 class="sidebar__title">Manage perfumes</h2>

        <div class="sidebar__control">
          <span class="sidebar__label">Sort by highest<br />price</span>
          <label class="toggle-switch">
            <input type="checkbox" id="sort-toggle" />
            <span class="slider"></span>
          </label>
        </div>

        <hr class="sidebar__divider" />

        <div class="sidebar__control sidebar__control--column">
          <span class="sidebar__label">Count total price ($):</span>
          <button class="btn btn--blue" id="count-btn">Count</button>
          <div class="sidebar__total">
            Total price: $<span id="total-value">0</span>
          </div>
        </div>
      </aside>

      <section class="content">
        <div class="cards-grid" id="items-grid"></div>
      </section>
    </main>

    <div id="edit-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <h2>Edit Perfume</h2>

        <div class="form-group">
          <label for="edit-brand">Manufacturer:</label>
          <select id="edit-brand" class="modal-input">
            <option value="Chanel">Chanel</option>
            <option value="Dior">Dior</option>
            <option value="Armani">Armani</option>
            <option value="Tom Ford">Tom Ford</option>
            <option value="Gucci">Gucci</option>
            <option value="Versace">Versace</option>
          </select>
        </div>

        <div class="form-group">
          <label for="edit-volume">New Volume (ml):</label>
          <input
            type="number"
            id="edit-volume"
            class="modal-input"
            min="10"
            max="500"
          />
        </div>

        <div class="modal-actions">
          <button id="save-edit-btn" class="btn btn--blue">Save</button>
          <button id="cancel-edit-btn" class="btn btn--outline-red">
            Cancel
          </button>
        </div>
      </div>
    </div>

    <div id="info-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <h2 id="info-modal-title" style="margin-bottom: 15px">Notice</h2>
        <p id="info-modal-message">Message</p>
        <div class="modal-actions" style="margin-top: 20px">
          <button id="info-modal-close" class="btn btn--outline-red">
            Close
          </button>
        </div>
      </div>
    </div>

    <script src="js/index.js"></script>
  </body>
</html>
