<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Perfume</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__brand">My Perfumes</div>
      <nav class="header__nav">
        <a href="index.html" class="header__link">My Perfumes</a>
        <a href="create.html" class="header__link header__link--active"
          >Create Perfume</a
        >
      </nav>
    </header>

    <main class="main-container main-container--center">
      <div class="create-wrapper">
        <div class="create-visual">
          <h2>Expand Your Collection</h2>
          <p>
            Select your favorite manufacturer and specify the bottle volume to
            instantly add a new fragrance to your personal collection.
          </p>
          <div class="visual-circle"></div>
        </div>

        <section class="form-section">
          <h1 class="form-title">Create Perfume</h1>
          <form id="create-form" class="crud-form" novalidate>
            <div class="form-group">
              <label for="brand">Manufacturer</label>
              <select id="brand" name="brand" required>
                <option value="" disabled selected>
                  Select Manufacturer...
                </option>
                <option value="Chanel" data-price-per-ml="2.5">
                  Chanel ($2.5/ml)
                </option>
                <option value="Dior" data-price-per-ml="2.0">
                  Dior ($2.0/ml)
                </option>
                <option value="Armani" data-price-per-ml="1.8">
                  Armani ($1.8/ml)
                </option>
                <!-- Додані нові бренди -->
                <option value="Tom Ford" data-price-per-ml="5.0">
                  Tom Ford ($5.0/ml)
                </option>
                <option value="Gucci" data-price-per-ml="1.2">
                  Gucci ($1.2/ml)
                </option>
                <option value="Versace" data-price-per-ml="1.22">
                  Versace ($1.22/ml)
                </option>
              </select>
            </div>
            <div class="form-group">
              <label for="volume">Volume (ml)</label>
              <input
                type="number"
                id="volume"
                name="volume"
                min="10"
                max="500"
                required
                placeholder="e.g., 50"
              />
            </div>
            <div class="form-group">
              <label for="price">Calculated Price ($)</label>
              <input
                type="number"
                id="price"
                name="price"
                readonly
                placeholder="Will be calculated automatically"
              />
            </div>
            <button type="submit" class="btn btn--blue btn--full-width">
              Submit
            </button>
          </form>
        </section>
      </div>
    </main>

    <div id="modal" class="modal-overlay hidden">
      <div class="modal-content">
        <h2 id="modal-title">Error</h2>
        <p id="modal-message">Please fill out all fields correctly.</p>
        <button id="modal-close" class="btn btn--outline-red">Close</button>
      </div>
    </div>

    <script src="js/create.js"></script>
  </body>
</html>
